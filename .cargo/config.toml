# Windows has no Visual C++ runtime until someone installs the redistributable, so a DLL that
# links it dynamically fails to load on a clean machine with "Error 126: The specified module could
# not be found" -- while Godot itself, which is linked statically, starts fine. Link the CRT into
# the extension so it carries what it needs. Safe here because nothing owned by the CRT crosses the
# GDExtension boundary: the plugin allocates and frees on its own side of a C API.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.wasm32-unknown-emscripten]
rustflags = [
  "-C", "link-args=-sSIDE_MODULE=2",
  "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
  "-C", "link-args=-pthread",
  "-C", "link-arg=-fwasm-exceptions",
  "-C", "llvm-args=-enable-emscripten-cxx-exceptions=0",
  "-Z", "emscripten-wasm-eh=false",
  "-Z", "link-native-libraries=no",
  "-Zunstable-options",
  "-C", "panic=immediate-abort"
]

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi23-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.aarch64-linux-android]
linker = "aarch64-linux-android23-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
linker = "x86_64-linux-android23-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.i686-linux-android]
linker = "i686-linux-android23-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
