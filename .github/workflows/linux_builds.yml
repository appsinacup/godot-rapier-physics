name: 🐧 Linux Builds
on:
  workflow_call:

jobs:
  linux:
    runs-on: "ubuntu-22.04"
    name: ${{ matrix.dimensions.short }} ${{ matrix.precision }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "armv7-unknown-linux-gnueabihf", "i686-unknown-linux-gnu"]
        precision: [single] #, double]
        dimensions: [{"feature": "dim2", "short": "2d"}, {"feature": "dim3", "short": "3d"}]

    steps:
      - uses: actions/checkout@v6
      - name: Setup Godot
        uses: appsinacup/setup-godot-action@main
        with:
          version: '4.7-stable'
      - name: "Install dependencies"
        shell: sh
        run: |
          sudo dpkg --add-architecture aarch64
          sudo apt-get update
          sudo apt-get install libunwind-dev
          sudo apt-get install build-essential
          sudo apt-get install pkg-config
          sudo apt-get install libssl-dev
          sudo apt-get install zlib1g-dev
          # Multi platform build
          sudo apt-get install gcc-multilib g++-multilib libc6-dev-i386
          # Arm64 and arm32
          sudo apt install gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          # LLVM for godot-rust api-custom bindgen
          sudo apt-get install llvm-dev libclang-dev clang
      # Godot's own Linux binaries target glibc 2.28, so the extension has to reach at least as far
      # back, not as far back as whatever the runner happens to ship.
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Setup cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        uses: ./.github/actions/build
        with:
          arch: ${{ matrix.arch }}
          glibc: "2.28"
          features: serde-serialize,parallel,register-docs,${{ matrix.precision }}-${{ matrix.dimensions.feature }}
      - name: Check glibc floor
        shell: bash
        run: |
          max=$(readelf -V target/release/libgodot_rapier.so | grep -o 'GLIBC_[0-9.]\+' | sort -uV | tail -1)
          echo "highest glibc symbol version required: $max"
          if [ "$(printf '%s\n' "$max" GLIBC_2.28 | sort -V | tail -1)" != "GLIBC_2.28" ]; then
            echo "::error::linked against $max, above the 2.28 floor -- zigbuild did not take effect"
            exit 1
          fi
      - name: Copy to bin
        shell: sh
        run: |
          mv target/release/libgodot_rapier.so bin${{ matrix.dimensions.short }}/addons/godot-rapier${{ matrix.dimensions.short }}/bin/libgodot_rapier.linux.${{ matrix.arch }}.so
          mv target/release/libgodot_rapier.a bin${{ matrix.dimensions.short }}/addons/godot-rapier${{ matrix.dimensions.short }}/bin/libgodot_rapier.linux.${{ matrix.arch }}.a
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: godot-rapier-${{ matrix.dimensions.short }}-${{ matrix.precision }}-${{ matrix.arch}}
          path: |
            bin${{ matrix.dimensions.short }}/**/*.so
          if-no-files-found: error
      - name: Upload Static
        uses: actions/upload-artifact@v6
        with:
          name: static-rapier-${{ matrix.dimensions.short }}-${{ matrix.precision }}-${{ matrix.arch}}
          path: |
            bin${{ matrix.dimensions.short }}/**/*.a
          if-no-files-found: error
    
