name: 🍎 macOS Builds
on:
  workflow_call:

env:
  LLVM_PATH: /opt/homebrew/opt/llvm/bin

jobs:
  macos:
    runs-on: "macos-26"
    name: ${{ matrix.dimensions.short }} ${{ matrix.precision }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch:  ["x86_64-apple-darwin"]
        precision: [single] #, double]
        dimensions: [{"feature": "dim2", "short": "2d"}, {"feature": "dim3", "short": "3d"}]

    steps:
      - uses: actions/checkout@v6
      - name: Setup Godot
        uses: appsinacup/setup-godot-action@main
        with:
          version: '4.7-stable'
      - name: Build
        uses: ./.github/actions/build
        with:
          arch: ${{ matrix.arch }}
          toolchain: nightly-2025-12-12
          features: serde-serialize,parallel,${{ matrix.precision }}-${{ matrix.dimensions.feature }}
      - name: Package export and editor libraries
        shell: sh
        run: |
          sh scripts/package-build.sh macos "${{ matrix.dimensions.short }}" "${{ matrix.arch }}"
      - name: Mac Sign
        uses: ughuuu/godot-cpp-template/.github/actions/sign@add-more-stuff/options-to-build
        with:
          FRAMEWORK_PATH: bin${{ matrix.dimensions.short }}/addons/godot-rapier${{ matrix.dimensions.short }}/bin/libgodot_rapier.macos.framework
          SIGN_FLAGS: "--deep"
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_DEV_PASSWORD: ${{ secrets.APPLE_DEV_PASSWORD }}
          APPLE_DEV_ID: ${{ secrets.APPLE_DEV_ID }}
          APPLE_DEV_TEAM_ID: ${{ secrets.APPLE_DEV_TEAM_ID }}
          APPLE_DEV_APP_ID: ${{ secrets.APPLE_DEV_APP_ID }}
        if: github.ref == 'refs/heads/main'
      - name: Release temporary signing keychain
        shell: sh
        run: security delete-keychain ephemeral.keychain
        if: github.ref == 'refs/heads/main'
      - name: Mac Sign Editor
        uses: ughuuu/godot-cpp-template/.github/actions/sign@add-more-stuff/options-to-build
        with:
          FRAMEWORK_PATH: bin${{ matrix.dimensions.short }}/addons/godot-rapier${{ matrix.dimensions.short }}/bin/editor/libgodot_rapier.macos.framework
          SIGN_FLAGS: "--deep"
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_DEV_PASSWORD: ${{ secrets.APPLE_DEV_PASSWORD }}
          APPLE_DEV_ID: ${{ secrets.APPLE_DEV_ID }}
          APPLE_DEV_TEAM_ID: ${{ secrets.APPLE_DEV_TEAM_ID }}
          APPLE_DEV_APP_ID: ${{ secrets.APPLE_DEV_APP_ID }}
        if: github.ref == 'refs/heads/main'
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: godot-rapier-${{ matrix.dimensions.short }}-${{ matrix.precision }}-${{ matrix.arch}}
          path: |
            bin${{ matrix.dimensions.short }}/**/*.dylib
            bin${{ matrix.dimensions.short }}/**/CodeResources
            bin${{ matrix.dimensions.short }}/**/Info.plist
          if-no-files-found: error

      - name: Upload Static
        uses: actions/upload-artifact@v6
        with:
          name: static-rapier-${{ matrix.dimensions.short }}-${{ matrix.precision }}-${{ matrix.arch}}
          path: |
            bin${{ matrix.dimensions.short }}/**/*.a
          if-no-files-found: error
