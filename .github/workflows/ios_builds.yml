name: 🍏 iOS Builds
on:
  workflow_call:

env:
  LLVM_PATH: /opt/homebrew/opt/llvm/bin

jobs:
  ios:
    runs-on: "macos-latest"
    name: ${{ matrix.dimensions.short }} ${{ matrix.precision }} ${{ matrix.arch.name }}
    strategy:
      fail-fast: false
      matrix:
        arch: [{"name" : "arm64", "rust": "aarch64-apple-ios"}, {"name" : "x86_64", "rust": "x86_64-apple-ios"}]
        precision: [single] #, double]
        dimensions: [{"feature": "dim2", "short": "2d"}, {"feature": "dim3", "short": "3d"}]

    steps:
      - uses: actions/checkout@v6
      - name: Set IPHONEOS_DEPLOYMENT_TARGET
        run: |
          echo "IPHONEOS_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
      - name: Setup Godot
        uses: appsinacup/setup-godot-action@main
        with:
          version: '4.7-stable'
      - name: Build
        uses: ./.github/actions/build
        with:
          arch: ${{ matrix.arch.rust }}
          toolchain: nightly-2025-12-12
          features: serde-serialize,parallel,${{ matrix.precision }}-${{ matrix.dimensions.feature }}
      - name: Package export and editor libraries
        shell: sh
        run: |
          sh scripts/package-build.sh ios "${{ matrix.dimensions.short }}" "${{ matrix.arch.name }}"
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: godot-rapier-${{ matrix.dimensions.short }}-${{ matrix.precision }}-${{ matrix.arch.rust}}
          path: |
            bin${{ matrix.dimensions.short }}/**/*.${{ matrix.arch.name }}
            bin${{ matrix.dimensions.short }}/**/Info.plist
          if-no-files-found: error

      - name: Upload Static
        uses: actions/upload-artifact@v6
        with:
          name: static-rapier-${{ matrix.dimensions.short }}-${{ matrix.precision }}-${{ matrix.arch.rust}}
          path: |
            bin${{ matrix.dimensions.short }}/**/*.a
          if-no-files-found: error
