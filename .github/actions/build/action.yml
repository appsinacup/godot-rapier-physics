name: Physics Server Rapier Build
description: Build Godot Cpp and the Physics Server 2D Extension.

inputs:
  arch:
    required: true
    default: ''
    description: Rust target platform.
  extra_flags:
    required: false
    default: ''
    description: Rust extra flags.
  features:
    required: true
    description: Base cargo features without register-docs; editor builds add it automatically.
  api_feature:
    required: false
    default: api-custom
    description: Godot API feature to use. Must be exactly one api-* feature.
  profile:
    required: false
    default: release
    description: Cargo profile to use.
  toolchain:
    required: false
    default: ''
    description: Rust toolchain override. Defaults to rust-toolchain.toml.
  glibc:
    required: false
    default: ''
    description: Oldest glibc to link against, e.g. 2.28. Builds through cargo-zigbuild when set.

runs:
  using: composite
  steps:
    - name: Show targets
      shell: sh
      run: |
        rustc --print=target-list
    - name: Rust Add target
      shell: sh
      run: |
        TOOLCHAIN="${{ inputs.toolchain }}"
        if [ -z "$TOOLCHAIN" ]; then
          TOOLCHAIN=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/channel = "(.*)"/\1/')
        fi
        rustup toolchain install "$TOOLCHAIN"
        rustup component add rust-src --toolchain "$TOOLCHAIN"
        rustup target add ${{ inputs.arch }} --toolchain "$TOOLCHAIN"
    - name: Build export and editor libraries sequentially
      shell: sh
      run: |
        set -eu
        TOOLCHAIN="${{ inputs.toolchain }}"
        if [ -z "$TOOLCHAIN" ]; then
          TOOLCHAIN=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/channel = "(.*)"/\1/')
        fi
        if [ -n "${{ inputs.glibc }}" ]; then
          BUILD="zigbuild"
          TARGET="${{ inputs.arch }}.${{ inputs.glibc }}"
        else
          BUILD="build"
          TARGET="${{ inputs.arch }}"
        fi
        if [ "${{ inputs.arch }}" = x86_64-apple-darwin ]; then
          rustup target add aarch64-apple-darwin --toolchain "$TOOLCHAIN"
        fi
        for VARIANT in release editor; do
          FEATURES="${{ inputs.features }},${{ inputs.api_feature }}"
          if [ "$VARIANT" = editor ]; then
            FEATURES="$FEATURES,register-docs"
          fi
          GDRUST_GODOT_BIN="${GODOT4:-}" cargo +"$TOOLCHAIN" "$BUILD" --target="$TARGET" --profile=${{ inputs.profile }} --features="$FEATURES" ${{ inputs.extra_flags }}
          # Save this variant before the next cargo build replaces the target's output.
          rm -rf "target/$VARIANT"
          mkdir -p "target/$VARIANT"
          for LIBRARY in target/${{ inputs.arch }}/${{ inputs.profile }}/*; do
            case "$LIBRARY" in
              *.so|*.dll|*.dylib|*.wasm|*.a|*.lib) cp "$LIBRARY" "target/$VARIANT/" ;;
            esac
          done
          if [ "${{ inputs.arch }}" = x86_64-apple-darwin ]; then
            GDRUST_GODOT_BIN="${GODOT4:-}" cargo +"$TOOLCHAIN" build --target=aarch64-apple-darwin --profile=${{ inputs.profile }} --features="$FEATURES" ${{ inputs.extra_flags }}
            lipo -create -output "target/$VARIANT/libgodot_rapier.dylib" target/aarch64-apple-darwin/${{ inputs.profile }}/libgodot_rapier.dylib target/x86_64-apple-darwin/${{ inputs.profile }}/libgodot_rapier.dylib
            cp target/x86_64-apple-darwin/${{ inputs.profile }}/libgodot_rapier.a "target/$VARIANT/libgodot_rapier.x86_64.a"
            cp target/aarch64-apple-darwin/${{ inputs.profile }}/libgodot_rapier.a "target/$VARIANT/libgodot_rapier.arm64.a"
          fi
        done
